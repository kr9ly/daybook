name: test

on:
  push:
    # v2 は 2.0 KMP 作業ブランチ。Apple 向けコンパイルは手元（WSL）で実行できないため、
    # iOS レーンを CI 駆動で回す間は push でも走らせる
    branches: [main, v2]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # JVM ユニットテストのみ（instrumented テストはエミュレータが要るので CI では走らせない）
      - name: Run unit tests with coverage
        run: ./gradlew :daybook-core:koverXmlReport :daybook:koverXmlReportDebug :daybook-coroutines:koverXmlReport :daybook-test:koverXmlReport

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            daybook/build/reports/tests/
            daybook-core/build/reports/tests/
            daybook-coroutines/build/reports/tests/
            daybook-test/build/reports/tests/

      # カバレッジバッジは外部サービスを使わず、main への push 時に SVG を生成してリポジトリにコミットする。
      # 全モジュールの Kover XML から命令カバレッジを合算する
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .github/badges
          python3 .github/scripts/coverage_badge.py \
            daybook/build/reports/kover/reportDebug.xml \
            daybook-core/build/reports/kover/report.xml \
            daybook-coroutines/build/reports/kover/report.xml \
            daybook-test/build/reports/kover/report.xml \
            .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          if ! git diff --cached --quiet; then
            git commit -m "CI: カバレッジバッジ更新 [skip ci]"
            git push
          fi

  # iOS の保証はシミュレータ検証まで（KMP-2.0.md 裁定 2026-08-15）。
  # Apple 向けコンパイルは macOS ホストでしかできないため、このジョブが iOS レーンの唯一の検証点。
  # iosArm64（実機向け）はコンパイルまで、テスト実行は iosSimulatorArm64 のシミュレータで行う
  ios-simulator-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native のツールチェーンと platform klib は ~/.konan に落ちる（数百 MB）ので
      # Kotlin バージョン単位でキャッシュする
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile iosArm64 and run simulator tests
        run: ./gradlew :daybook-core:compileKotlinIosArm64 :daybook-core:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-reports
          path: daybook-core/build/reports/tests/
