name: test

on:
  push:
    # v2 は 2.0 KMP 作業ブランチ（main マージ時に外す）
    branches: [main, v2]
  pull_request:

permissions:
  contents: write

jobs:
  # フォーマット検査は test と切り離した独立 job（速いフィードバック + 失敗理由の分離）
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run spotless check
        run: ./gradlew spotlessCheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # JVM ユニットテストのみ（instrumented テストはエミュレータが要るので CI では走らせない）
      - name: Run unit tests with coverage
        run: ./gradlew :daybook-core:koverXmlReport :daybook:koverXmlReportDebug :daybook-coroutines:koverXmlReport :daybook-test:koverXmlReport :daybook-multiplatform-settings:koverXmlReport

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            daybook/build/reports/tests/
            daybook-core/build/reports/tests/
            daybook-coroutines/build/reports/tests/
            daybook-test/build/reports/tests/
            daybook-multiplatform-settings/build/reports/tests/

  # カバレッジバッジの生成は device-test.yml の android-emulator-test job に移設した
  # （エミュレータレーンの JaCoCo XML とのユニオンマージが必要なため。裁定 2026-08-16）

  # Native（Kotlin/Native）の Linux レーン: nativeMain / linuxMain の actual の CI 回帰。
  # K/N にはカバレッジツールが存在しないため数値は出ない（実行検証のみ。DESIGN.md テスト戦略を参照）
  native-linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run linuxX64 tests
        run: ./gradlew :daybook-core:linuxX64Test :daybook-multiplatform-settings:linuxX64Test
