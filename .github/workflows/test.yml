name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # JVM ユニットテストのみ（instrumented テストはエミュレータが要るので CI では走らせない）
      - name: Run unit tests with coverage
        run: ./gradlew :daybook-core:koverXmlReport :daybook:koverXmlReportDebug :daybook-coroutines:koverXmlReportDebug :daybook-test:koverXmlReportDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            daybook/build/reports/tests/
            daybook-core/build/reports/tests/
            daybook-coroutines/build/reports/tests/
            daybook-test/build/reports/tests/

      # カバレッジバッジは外部サービスを使わず、main への push 時に SVG を生成してリポジトリにコミットする。
      # 全モジュールの Kover XML から命令カバレッジを合算する
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .github/badges
          python3 .github/scripts/coverage_badge.py \
            daybook/build/reports/kover/reportDebug.xml \
            daybook-core/build/reports/kover/report.xml \
            daybook-coroutines/build/reports/kover/reportDebug.xml \
            daybook-test/build/reports/kover/reportDebug.xml \
            .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          if ! git diff --cached --quiet; then
            git commit -m "CI: カバレッジバッジ更新 [skip ci]"
            git push
          fi
