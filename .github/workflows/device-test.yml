name: device-test

# 環境依存レーン: Android エミュレータの instrumented テスト（androidTest 15 件 = 通常 13 + キル系 2）と
# iOS シミュレータテスト。実機回帰を手元エミュレータから GHA に載せ替える裁定（2026-08-15、KMP-2.0.md）の実施。
# 速い決定的レーン（lint + JVM ユニットテスト）は test.yml。

on:
  push:
    # v2 は 2.0 KMP 作業ブランチ（main マージ時に外す）
    branches: [main, v2]
  pull_request:
  # 回帰の手動再実行用（paths-filter を素通しして必ず実行する）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # エミュレータ / シミュレータ job は遅い・高コストのため、関連パスの変更時だけ走らせる
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        # workflow_dispatch には比較基準がないため filter を実行しない
        # （job 側の if が event_name で素通しする）
        if: github.event_name != 'workflow_dispatch'
        with:
          # push では同一ブランチの直前コミットと比較する（省略時はデフォルトブランチ比較になり
          # 常に true になってしまう）。pull_request ではこの入力は無視され PR の base と比較される
          base: ${{ github.ref_name }}
          filters: |
            android:
              - 'daybook/**'
              - 'daybook-core/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - '.github/workflows/device-test.yml'
            ios:
              - 'daybook-core/**'
              - 'daybook-multiplatform-settings/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - '.github/workflows/device-test.yml'

  android-emulator-test:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu ランナーでハードウェアアクセラレーションを使うための KVM 開放
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD の作成 + 初回ブートが数分かかるため、スナップショットをキャッシュして 2 回目以降を短縮する
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # キル系 2 件（ProcessKillResilienceTest）は -Pdaybook.processKillTests の隔離スイート。
      # エミュレータで flaky になりがちなリトライ前提の設計（:daybook/build.gradle.kts）のため、
      # 失敗時は 1 回だけ再試行する。通常スイートと同じエミュレータセッション内で 2 段 invocation する
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :daybook:connectedDebugAndroidTest
            ./gradlew -Pdaybook.processKillTests :daybook:connectedDebugAndroidTest || ./gradlew -Pdaybook.processKillTests :daybook:connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports
          path: daybook/build/reports/androidTests/

  # iOS の保証はシミュレータ検証まで（KMP-2.0.md 裁定 2026-08-15）。
  # Apple 向けコンパイルは macOS ホストでしかできないため、このジョブが iOS レーンの唯一の検証点。
  # iosArm64（実機向け）はコンパイルまで、テスト実行は iosSimulatorArm64 のシミュレータで行う
  ios-simulator-test:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native のツールチェーンと platform klib は ~/.konan に落ちる（数百 MB）ので
      # Kotlin バージョン単位でキャッシュする
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile iosArm64 and run simulator tests
        run: >
          ./gradlew
          :daybook-core:compileKotlinIosArm64 :daybook-core:iosSimulatorArm64Test
          :daybook-multiplatform-settings:compileKotlinIosArm64 :daybook-multiplatform-settings:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-reports
          path: |
            daybook-core/build/reports/tests/
            daybook-multiplatform-settings/build/reports/tests/
