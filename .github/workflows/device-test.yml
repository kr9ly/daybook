name: device-test

# 環境依存レーン: Android エミュレータの instrumented テスト（androidTest 15 件 = 通常 13 + キル系 2）と
# iOS シミュレータテスト。実機回帰を手元エミュレータから GHA に載せ替える裁定（2026-08-15、KMP-2.0.md）の実施。
# 速い決定的レーン（lint + JVM ユニットテスト）は test.yml。

on:
  push:
    branches: [main]
  pull_request:
  # 回帰の手動再実行用（paths-filter を素通しして必ず実行する）
  workflow_dispatch:

# contents: write はカバレッジバッジのコミット（android-emulator-test job、main push 時のみ）に使う
permissions:
  contents: write

jobs:
  # エミュレータ / シミュレータ job は遅い・高コストのため、関連パスの変更時だけ走らせる
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      iosHarness: ${{ steps.filter.outputs.iosHarness }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        # workflow_dispatch には比較基準がないため filter を実行しない
        # （job 側の if が event_name で素通しする）
        if: github.event_name != 'workflow_dispatch'
        with:
          # push では同一ブランチの直前コミットと比較する（省略時はデフォルトブランチ比較になり
          # 常に true になってしまう）。pull_request ではこの入力は無視され PR の base と比較される
          base: ${{ github.ref_name }}
          filters: |
            android:
              - 'daybook/**'
              - 'daybook-core/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - '.github/workflows/device-test.yml'
            ios:
              - 'daybook-core/**'
              - 'daybook-multiplatform-settings/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - '.github/workflows/device-test.yml'
            iosHarness:
              - 'daybook-core/**'
              - 'daybook-ios-harness/**'
              - 'ios-harness/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - '.github/workflows/device-test.yml'

  android-emulator-test:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu ランナーでハードウェアアクセラレーションを使うための KVM 開放
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD の作成 + 初回ブートが数分かかるため、スナップショットをキャッシュして 2 回目以降を短縮する
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # キル系 2 件（ProcessKillResilienceTest）は -Pdaybook.processKillTests の隔離スイート。
      # エミュレータで flaky になりがちなリトライ前提の設計（:daybook/build.gradle.kts）のため、
      # 失敗時は 1 回だけ再試行する。通常スイートと同じエミュレータセッション内で 2 段 invocation する。
      # 通常スイートは createDebugAndroidTestCoverageReport 経由で実行し、JaCoCo XML を出す
      # （バッジのユニオンマージに使う。キル系はプロセスキルでカバレッジデータが飛ぶため計測対象外）
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :daybook:createDebugAndroidTestCoverageReport
            ./gradlew -Pdaybook.processKillTests :daybook:connectedDebugAndroidTest || ./gradlew -Pdaybook.processKillTests :daybook:connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports
          path: daybook/build/reports/androidTests/

      # カバレッジバッジ: JVM レーン（kover）+ エミュレータレーン（JaCoCo）をライン単位で
      # ユニオンマージして生成する。エミュレータの XML が手に入るのがこの job だけのため、
      # バッジ生成はここに置く（test.yml から移設。裁定 2026-08-16: 計測レーンの例外最小化）
      # 生成は常時走らせてマージ結果の % をログに出す（JaCoCo XML のパス・マージの回帰検知）。
      # リポジトリへのコミットだけ main push 時
      - name: Generate JVM coverage reports
        run: ./gradlew :daybook-core:koverXmlReport :daybook:koverXmlReportDebug :daybook-coroutines:koverXmlReport :daybook-test:koverXmlReport :daybook-multiplatform-settings:koverXmlReport

      - name: Generate coverage badge
        run: |
          mkdir -p .github/badges
          python3 .github/scripts/coverage_badge.py \
            daybook/build/reports/kover/reportDebug.xml \
            daybook-core/build/reports/kover/report.xml \
            daybook-coroutines/build/reports/kover/report.xml \
            daybook-test/build/reports/kover/report.xml \
            daybook-multiplatform-settings/build/reports/kover/report.xml \
            evidence:daybook/build/reports/coverage/androidTest/debug/connected/report.xml \
            .github/badges/coverage.svg

      # マージ結果の内訳検証（% が動いたときの診断）用に、入力 XML 一式を常に残す
      - name: Upload coverage XMLs
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-reports
          path: |
            daybook/build/reports/coverage/androidTest/debug/connected/report.xml
            daybook/build/reports/kover/reportDebug.xml
            daybook-core/build/reports/kover/report.xml
            daybook-coroutines/build/reports/kover/report.xml
            daybook-test/build/reports/kover/report.xml
            daybook-multiplatform-settings/build/reports/kover/report.xml

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          if ! git diff --cached --quiet; then
            git commit -m "CI: カバレッジバッジ更新 [skip ci]"
            git push
          fi

  # iOS の保証はシミュレータ検証まで（KMP-2.0.md 裁定 2026-08-15）。
  # Apple 向けコンパイルは macOS ホストでしかできないため、このジョブが iOS レーンの唯一の検証点。
  # iosArm64（実機向け）はコンパイルまで、テスト実行は iosSimulatorArm64 のシミュレータで行う
  ios-simulator-test:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native のツールチェーンと platform klib は ~/.konan に落ちる（数百 MB）ので
      # Kotlin バージョン単位でキャッシュする
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile iosArm64 and run simulator tests
        run: >
          ./gradlew
          :daybook-core:compileKotlinIosArm64 :daybook-core:iosSimulatorArm64Test
          :daybook-multiplatform-settings:compileKotlinIosArm64 :daybook-multiplatform-settings:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-reports
          path: |
            daybook-core/build/reports/tests/
            daybook-multiplatform-settings/build/reports/tests/

  # Xcode ホストアプリハーネス: App Group コンテナの実パス解決とコンテナ上のストア動作の検証。
  # K/N の Gradle テスト（simctl spawn、app bundle なし）では containerURL が null になるため、
  # app identity のあるホストアプリ + XCTest でだけ成立するレーン（実測 2026-08-16）。
  # Xcode プロジェクトはリポジトリ管理せず XcodeGen（ios-harness/project.yml）で生成する
  ios-host-app-test:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.iosHarness == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build harness framework
        run: ./gradlew :daybook-ios-harness:linkDebugFrameworkIosSimulatorArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios-harness/project.yml --project ios-harness

      # シミュレータのデバイス名は Xcode バージョンで変わるため、利用可能な iPhone を動的に選ぶ
      - name: Run host app tests
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*\)(.*/\1/p' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project ios-harness/DaybookHarness.xcodeproj \
            -scheme DaybookHarness \
            -destination "platform=iOS Simulator,name=$DEVICE"

      - name: Upload xcodebuild results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-host-app-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
