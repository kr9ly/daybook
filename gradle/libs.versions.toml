[versions]
agp = "9.3.1"
# KMP モジュール（daybook-core）用の KGP。AGP 9 built-in Kotlin と同一ビルドで共存させるため
# 2.3.0+ 推奨ライン（kotlin-tooling-agp9-migration マトリクス）に合わせる
kotlin = "2.3.20"
# 消費側サポートライン: Kotlin 2.0+ / minSdk 21+。
# 宣言依存は「必要 API を持つ最古の安定版」= 消費側への床。新しい環境では上に解決される。
kotlin-stdlib = "2.0.0"
kotlinx-coroutines = "1.8.1"
junit = "4.13.2"
robolectric = "4.16.1"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.9" }
spotless = { id = "com.diffplug.spotless", version = "8.9.0" }
